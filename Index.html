<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coin Catcher</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#0f172a}
#game{width:100vw;height:100vh;position:relative;background:linear-gradient(#172554,#0f172a)}
#hud{position:absolute;top:15px;width:100%;display:flex;justify-content:space-between;padding:0 15px;color:white;font-size:20px;font-weight:bold}
.box{background:#0008;padding:9px 13px;border-radius:12px}
.coin{position:absolute;width:60px;height:60px;border-radius:50%;
background:#ffd700;border:3px solid #fff59d;box-shadow:0 0 20px #facc15;
display:flex;align-items:center;justify-content:center;font-size:28px}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0008;z-index:5}
.panel{background:white;color:#111827;padding:30px;border-radius:25px;text-align:center;width:88%}
button{background:#2563eb;color:white;border:0;border-radius:15px;padding:15px 25px;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="box" id="score">💰 0</div>
<div class="box" id="time">⏱️ 30</div>
</div>

<div id="start">
<div class="panel">
<h1>💰 Coin Catcher</h1>
<p>30 soniyada iloji boricha ko‘p tangani ushla!</p>
<button onclick="startGame()">O‘YINNI BOSHLASH</button>
</div>
</div>
</div>

<script>
let score=0,time=30,running=false,timer,spawner;
const game=document.getElementById("game");
const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const start=document.getElementById("start");

function update(){
scoreEl.textContent="💰 "+score;
timeEl.textContent="⏱️ "+time;
}

function coin(){
if(!running)return;
let c=document.createElement("div");
c.className="coin";
c.textContent="💰";
c.style.left=Math.random()*(innerWidth-60)+"px";
c.style.top=(80+Math.random()*(innerHeight-150))+"px";

c.onclick=()=>{
if(running){
score++;
update();
c.remove();
}
};

game.appendChild(c);
setTimeout(()=>c.remove(),1200);
}

function startGame(){
score=0;
time=30;
running=true;
start.style.display="none";
document.querySelectorAll(".coin").forEach(x=>x.remove());
update();

clearInterval(timer);
clearInterval(spawner);

coin();
spawner=setInterval(coin,650);

timer=setInterval(()=>{
time--;
update();

if(time<=0){
running=false;
clearInterval(timer);
clearInterval(spawner);
document.querySelectorAll(".coin").forEach(x=>x.remove());

start.style.display="flex";
start.innerHTML=
'<div class="panel"><h1>🎉 O‘yin tugadi!</h1>'+
'<p>Natijangiz: <b>'+score+' ta tanga</b></p>'+
'<button onclick="startGame()">QAYTA O‘YNASH</button></div>';
}
},1000);
}

update();
</script>
</body>
</html>
